name: Bug report
description: Report a SafeScreen layout or tray problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. Remove personal content from screenshots before uploading them.
  - type: input
    id: version
    attributes:
      label: SafeScreen version
      placeholder: 1.4.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: Display setup
      description: Resolution, scaling, monitor count, and taskbar position
      placeholder: 1920x1200, 100%, one monitor, taskbar at bottom
    validations:
      required: true
  - type: input
    id: margins
    attributes:
      label: SafeScreen margins
      placeholder: Left 80, top 0, bottom 100
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, what happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Redacted screenshots or other details, if useful
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, private chats, and other personal content from attachments.
          required: true
