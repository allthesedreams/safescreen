<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">SafeScreen</title>
  <description id="description">A Windows utility that keeps damaged monitor edges outside the usable desktop.</description>
  <defs>
    <pattern id="damage" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#2a1518"/>
      <rect width="3" height="18" fill="#b93847" opacity="0.8"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#111316"/>
  <path d="M0 0h1280v12H0z" fill="#b93847"/>
  <g transform="translate(74 94)">
    <rect width="86" height="86" rx="20" fill="#171b1f" stroke="#2d343a" stroke-width="2"/>
    <path d="M24 57V31l18-11 20 12v24L43 67 24 57Z" fill="none" stroke="#16b8d4" stroke-width="6" stroke-linejoin="round"/>
    <path d="m30 52 12 7 14-8V37L43 29l-13 8v15Z" fill="#16b8d4" opacity="0.18"/>
  </g>
  <text x="184" y="134" fill="#f1ede5" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">SafeScreen</text>
  <text x="78" y="208" fill="#aeb8bf" font-family="Segoe UI, Arial, sans-serif" font-size="25">Keep damaged pixels outside your desktop.</text>
  <g transform="translate(78 258)" filter="url(#shadow)">
    <rect width="1124" height="286" rx="22" fill="#07090b" stroke="#3a4249" stroke-width="3"/>
    <rect x="18" y="18" width="1088" height="250" rx="10" fill="#20262b"/>
    <rect x="18" y="18" width="76" height="250" fill="url(#damage)"/>
    <rect x="18" y="218" width="1088" height="50" fill="url(#damage)"/>
    <rect x="94" y="18" width="1012" height="200" fill="#e7edf0"/>
    <path d="M94 18v200h1012" fill="none" stroke="#16b8d4" stroke-width="6"/>
    <g transform="translate(746 42)">
      <rect width="330" height="118" rx="14" fill="#15191d"/>
      <text x="22" y="38" fill="#f1ede5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">VISIBLE AREA</text>
      <text x="22" y="70" fill="#94a2aa" font-family="Segoe UI, Arial, sans-serif" font-size="16">Left 80 · Top 0 · Bottom 100</text>
      <rect x="214" y="83" width="94" height="24" rx="12" fill="#16b8d4"/>
      <text x="236" y="101" fill="#071014" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">ACTIVE</text>
    </g>
    <text x="132" y="112" fill="#1a2328" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Your apps stay here.</text>
    <text x="132" y="151" fill="#53636c" font-family="Segoe UI, Arial, sans-serif" font-size="19">Windows respects the visible rectangle.</text>
    <text x="35" y="195" fill="#f1b0b8" font-family="Segoe UI, Arial, sans-serif" font-size="13" transform="rotate(-90 35 195)">DAMAGED EDGE</text>
  </g>
  <text x="78" y="596" fill="#77838a" font-family="Segoe UI, Arial, sans-serif" font-size="17">Windows tray utility · local-only · MIT licensed</text>
  <circle cx="1179" cy="590" r="7" fill="#16b8d4"/>
</svg>
